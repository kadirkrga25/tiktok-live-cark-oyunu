name: Render Keep Alive

on:
  schedule:
    # GitHub Actions runs independently of the browser and OBS session.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping ÇARKIX on Render
        env:
          HEALTH_URL: https://tiktok-live-cark-oyunu.onrender.com/healthz
        run: |
          echo "Pinging ${HEALTH_URL}"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            --retry 2 --retry-delay 5 \
            "${HEALTH_URL}"
          echo ""
          echo "ÇARKIX health check completed."
